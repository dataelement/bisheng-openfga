name: CI

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: cr.dataelem.com/dataelement/bisheng-openfga

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to cr.dataelem.com
        uses: docker/login-action@v3
        with:
          registry: cr.dataelem.com
          username: ${{ secrets.CR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CR_DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance false \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            -t ${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}-amd64 \
            --push .

  build_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to cr.dataelem.com
        uses: docker/login-action@v3
        with:
          registry: cr.dataelem.com
          username: ${{ secrets.CR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CR_DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance false \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            -t ${{ env.IMAGE_NAME }}:${{ steps.get_version.outputs.VERSION }}-arm64 \
            --push .

  notify_feishu:
    needs:
      - build_amd64
      - build_arm64
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Process git message
        run: |
          value=$(echo "${{ github.event.head_commit.message }}" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
          value=$(echo "${value}" | sed -e ':a' -e 'N' -e '$!ba' -e 's/\r/%0A/g')
          echo "message=${value}" >> $GITHUB_ENV
        shell: bash

      - name: Notify Feishu
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          method: 'POST'
          data: '{"msg_type":"post","content":{"post":{"zh_cn":{"title":"${{ steps.get_version.outputs.VERSION }} 镜像预发布成功","content":[[{"tag":"text","text":"发布功能："},{"tag":"text","text":"${{ env.message }}"}]]}}}}'

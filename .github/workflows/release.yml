name: PublishRelease

# 在 GitHub 上发布 Release 时触发，将预发布的 arch 镜像合并为 multi-arch manifest
on:
  release:
    types: [published]

env:
  IMAGE_NAME: cr.dataelem.com/dataelement/bisheng-openfga

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combine_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to cr.dataelem.com
        uses: docker/login-action@v3
        with:
          registry: cr.dataelem.com
          username: ${{ secrets.CR_DOCKERHUB_USERNAME }}
          password: ${{ secrets.CR_DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          docker manifest create ${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.IMAGE_NAME }}:${VERSION}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:${VERSION}

          docker manifest create ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.IMAGE_NAME }}:${VERSION}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:latest

  notify_feishu:
    needs: combine_and_publish
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Notify Feishu
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.FEISHU_WEBHOOK }}
          method: 'POST'
          data: '{"msg_type":"post","content":{"post":{"zh_cn":{"title":"${{ steps.get_version.outputs.VERSION }} 正式镜像发布成功","content":[[{"tag":"text","text":"multi-arch manifest 已推送至 cr.dataelem.com"}]]}}}}'
